limit_req_zone $binary_remote_addr zone=approval_api_limit:10m rate=30r/s;

# Docker's embedded resolver lets Stage A start before approval services exist.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=approval_api_limit burst=60 nodelay;
    set $approval_backend http://backend:8000;
    proxy_pass $approval_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
  }

  location / {
    set $approval_frontend http://frontend:80;
    proxy_pass $approval_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 8000;
  server_name _;
  client_max_body_size 100m;

  location / {
    set $paperless_upstream http://paperless:8000;
    proxy_pass $paperless_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 8000;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }
}

server {
  listen 8081;
  server_name _;

  location / {
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 8081;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
